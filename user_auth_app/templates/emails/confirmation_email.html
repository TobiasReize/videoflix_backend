<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Email</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Roboto, Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.36;
        }

        p {
            color: #535456;
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .blue {
            color: #2E3EDF;
        }

        .button {
            padding: 12px 24px;
            margin: 24px 0;
            background-color: #2E3EDF;
            border-radius: 40px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
        }

        .button:hover {
            cursor: pointer;
            background-color: #5763e2;
        }

        .button:active {
            background-color: #0315da;
        }

        .m-16 {
            margin: 16px 0;
        }
    </style>

</head>

<body>
    <div class="content">
        <p>Dear <span class="blue">{{ username }}</span>,</p>
        <p>Thank you for registering with <span class="blue">Videoflix</span>. To complete your registration and verify your email address, please click the link below:</p>
        <a class="button" href="{{ confirmation_link }}">Activate account</a>
        <p>If you did not create an account with us, please disregard this email.</p>
        <p class="m-16">Best regards,</p>
        <p>Your Videoflix Team.</p>
    </div>
</body>

</html>
